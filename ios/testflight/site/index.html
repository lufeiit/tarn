<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowArc</title>
<style>
:root{color-scheme:light dark;--fg:#1c1c1e;--muted:#6b6b70;--bg:#fff;--line:#e5e5ea;--accent:#5b4b8a}
@media(prefers-color-scheme:dark){:root{--fg:#f2f2f7;--muted:#a1a1a8;--bg:#111114;--line:#2c2c30;--accent:#b8a9f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:64px 22px 80px}
h1{font-size:2.2rem;letter-spacing:-.02em;margin:0 0 8px}
.lead{font-size:1.05rem;color:var(--muted);margin:0 0 2em}
h2{font-size:1.15rem;margin:2.2em 0 .5em}
a{color:var(--accent)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:1em 0}
footer{color:var(--muted);font-size:.85rem;margin-top:3em}
</style>
</head>
<body>
<main>
<h1>FlowArc</h1>
<p class="lead">A general-purpose VPN client for iOS. No servers, no subscriptions, no account.</p>

<div class="card">
<h2 style="margin-top:0">Links</h2>
<p><a href="./support.html">Support</a><br>
<a href="./privacy.html">Privacy Policy</a></p>
</div>

<p>FlowArc uses a configuration you provide to route network traffic. Open the app to import a subscription or configuration and connect.</p>

<footer>FlowArc · <a href="mailto:sp-flowarc@outlook.com">sp-flowarc@outlook.com</a></footer>
</main>
</body>
</html>
